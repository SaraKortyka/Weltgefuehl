<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weltgefuehl</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display (für elegante Titel) & Plus Jakarta Sans (für Fließtext) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f7f4ed;
            overflow: hidden;
        }

        .font-serif-custom {
            font-family: 'Playfair Display', serif;
        }

        /* Sanfter Aquarell-Hintergrund mit Verläufen und Animation */
        .watercolor-bg {
            background: 
                radial-gradient(circle at 15% 20%, rgba(184, 212, 222, 0.75) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(175, 206, 218, 0.7) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(243, 229, 195, 0.6) 0%, transparent 60%),
                radial-gradient(circle at 80% 15%, rgba(224, 207, 168, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 20% 85%, rgba(212, 228, 213, 0.5) 0%, transparent 45%);
            background-blend-mode: multiply;
            filter: blur(10px);
            transform: scale(1.1);
            animation: pulseBg 12s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% {
                transform: scale(1.05) rotate(0deg);
            }
            100% {
                transform: scale(1.12) rotate(1deg);
            }
        }

        /* Subtile Textur zur Simulation von Aquarellpapier */
        .paper-texture {
            background-image: radial-gradient(#3a506b 0.5px, transparent 0.5px), radial-gradient(#3a506b 0.5px, #f7f4ed 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            opacity: 0.03;
        }

        /* Soft Entrance-Animation */
        .fade-in {
            animation: fadeIn 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Sanfter pulsierender Kompass/Icon Effekte */
        .compass-pulse {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center p-4 text-slate-800 antialiased selection:bg-amber-200">

    <!-- Aquarell-Hintergrundebene -->
    <div class="absolute inset-0 watercolor-bg pointer-events-none"></div>
    
    <!-- Papiertextur-Überlagerung -->
    <div class="absolute inset-0 paper-texture pointer-events-none"></div>

    <!-- Hauptkarte / Text-Container -->
    <main class="relative z-10 max-w-lg w-full bg-white/50 backdrop-blur-md border border-white/70 rounded-3xl p-8 md:p-12 shadow-xl shadow-sky-900/5 text-center fade-in">
        
        <!-- Zier-Kompass SVG (passend zur Karte unten rechts im Bild) -->
        <div class="compass-pulse mb-6 inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-800/5 text-slate-700/80 p-3 border border-slate-700/10">
            <svg viewBox="0 0 100 100" class="w-full h-full stroke-current fill-none stroke-[2.5]" stroke-linecap="round" stroke-linejoin="round">
                <!-- Äußerer Kreis -->
                <circle cx="50" cy="50" r="45" stroke-dasharray="2 4" />
                <circle cx="50" cy="50" r="40" />
                <!-- Himmelsrichtungen -->
                <text x="50" y="22" font-size="10" text-anchor="middle" fill="currentColor" stroke="none" font-weight="bold">N</text>
                <text x="50" y="85" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">S</text>
                <text x="82" y="53" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">O</text>
                <text x="18" y="53" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">W</text>
                <!-- Nadel -->
                <polygon points="50,26 55,50 50,74 45,50" fill="currentColor" class="opacity-30" />
                <polygon points="50,26 55,50 50,50" fill="currentColor" />
            </svg>
        </div>

        <!-- Titel / Hauptinformation -->
        <h1 class="font-serif-custom text-3xl md:text-4xl text-slate-800 font-medium tracking-tight mb-4 leading-tight">
            Diese Website ist im Aufbau
        </h1>

        <!-- Subtext / Beschreibung -->
        <p class="text-slate-600 font-light leading-relaxed mb-8 text-sm md:text-base max-w-sm mx-auto">
            Hier entsteht in Kürze etwas Neues. Wir gestalten unsere Inhalte sorgfältig für Sie und sind bald erreichbar.
        </p>

        <!-- Dekorative Trennlinie mit Aquarell-Akzent -->
        <div class="w-24 h-1 mx-auto mb-8 rounded-full bg-gradient-to-r from-sky-300 via-amber-200 to-emerald-200 opacity-80"></div>

        <!-- Fußzeile / Kontakt Hinweis -->
        <footer class="text-xs text-slate-500 font-light tracking-wide">
            Vielen Dank für Ihre Geduld.
        </footer>
    </main>

</body>
</html>
